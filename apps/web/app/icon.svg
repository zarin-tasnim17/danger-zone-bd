<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Dark Tech Canvas Background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Emergency Red-to-Rose Shield -->
    <linearGradient id="shieldGrad" x1="120" y1="76" x2="396" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="40%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>

    <!-- Shield Border Glow -->
    <linearGradient id="strokeGrad" x1="120" y1="60" x2="396" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDA4AF"/>
      <stop offset="50%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>

    <!-- Upper Shield Specular Bevel -->
    <linearGradient id="highlightGrad" x1="256" y1="90" x2="256" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Depth -->
    <filter id="shadow" x="80" y="50" width="352" height="400" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#DC2626" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Frame for high contrast on light/dark browser chrome -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#334155" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Shield Base with Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Solid Shield -->
    <path d="M256 76 L396 138 C396 270 340 376 256 428 C172 376 116 270 116 138 Z"
          fill="url(#shieldGrad)"
          stroke="url(#strokeGrad)"
          stroke-width="12"
          stroke-linejoin="round"/>

    <!-- Specular Highlight Layer -->
    <path d="M256 94 L378 148 C373 240 338 316 256 370 C174 316 139 240 134 148 Z"
          fill="url(#highlightGrad)"/>
  </g>

  <!-- High-Legibility Alert Symbol (Centered Exclamation Mark) -->
  <!-- Vertical Bar (Bold, rounded ends) -->
  <rect x="238" y="168" width="36" height="120" rx="18" fill="#FFFFFF"/>
  <!-- Exclamation Dot -->
  <circle cx="256" cy="338" r="20" fill="#FFFFFF"/>
</svg>
