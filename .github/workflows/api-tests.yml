name: Backend API Audit & Test Suite

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/app/api/**'
      - 'packages/shared/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/app/api/**'
      - 'packages/shared/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:

jobs:
  api-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: dangerzonebd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck shared workspace package
        run: pnpm --filter @repo/shared typecheck

      - name: Push Prisma schema & generate client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/dangerzonebd_test
          DIRECT_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/dangerzonebd_test
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate --accept-data-loss

      - name: Typecheck API & Test Suite
        working-directory: apps/api
        run: npm run typecheck

      - name: Execute API CI Suite
        working-directory: apps/api
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/dangerzonebd_test
          DIRECT_URL: postgresql://postgres:postgres_ci_password@127.0.0.1:5432/dangerzonebd_test
          JWT_SECRET: ci_test_jwt_secret_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_32_characters_long
          CORS_ORIGIN: http://localhost:3000
        run: npm run test:api:ci

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            apps/api/tests/reports/results.json
            apps/api/tests/reports/junit.xml
            apps/api/tests/reports/coverage-summary.json
            apps/api/tests/reports/report.html
